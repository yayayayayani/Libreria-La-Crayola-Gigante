"550" y="368" text-anchor="middle" font-size="17">FK compra / producto</text><text x="550" y="394" text-anchor="middle" font-size="17">Cantidad y costo</text><path d="M550,150 L550,280" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="558" y="205" font-size="16" fill="#354f40">1 : N</text><rect x="30" y="280" width="280" height="130" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="170" y="312" text-anchor="middle" font-size="20" font-weight="bold">PRODUCTOS</text><text x="170" y="342" text-anchor="middle" font-size="17">PK id_producto</text><text x="170" y="368" text-anchor="middle" font-size="17">FK categoría</text><text x="170" y="394" text-anchor="middle" font-size="17">Stock y mínimo</text><path d="M310,345 L410,345" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="368" y="335" font-size="16" fill="#354f40">1 : N</text><rect x="790" y="280" width="280" height="150" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="930" y="312" text-anchor="middle" font-size="20" font-weight="bold">MOVIMIENTOS</text><text x="930" y="342" text-anchor="middle" font-size="17">PK id_movimiento</text><text x="930" y="368" text-anchor="middle" font-size="17">FK producto / recepción</text><text x="930" y="394" text-anchor="middle" font-size="17">Antes + cantidad = nuevo</text><text x="930" y="420" text-anchor="middle" font-size="17">Recepción opcional en apertura</text><path d="M930,150 L930,280" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="938" y="205" font-size="16" fill="#354f40">1 : N</text><path d="M170,410 L170,525" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="525" width="280" height="115" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="170" y="557" text-anchor="middle" font-size="20" font-weight="bold">IMAGENES_PRODUCTOS</text><text x="170" y="587" text-anchor="middle" font-size="17">PK/FK id_producto</text><text x="170" y="613" text-anchor="middle" font-size="17">Cero o una fotografía</text><rect x="410" y="525" width="280" height="115" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="550" y="557" text-anchor="middle" font-size="20" font-weight="bold">CATEGORIAS</text><text x="550" y="587" text-anchor="middle" font-size="17">PK id_categoria</text><text x="550" y="613" text-anchor="middle" font-size="17">Una categoría por producto</text><path d="M410,580 L310,390" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="368" y="475" font-size="16" fill="#354f40">1 : N</text><path d="M170,410 L170,465 L930,465 L930,430" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="450" y="455" font-size="16">Un producto tiene muchos movimientos</text><text x="40" y="725" font-size="18">El usuario registra compras, recepciones y movimientos.</text><text x="40" y="760" font-size="18">La recepción completa es obligatoria en el flujo de la aplicación.</text><text x="40" y="795" font-size="18">El esquema también contiene usuarios, roles, permisos, clientes y cola de correo.</text></g></svg>