<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486452"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#203d31"><rect x="30" y="30" width="260" height="100" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="160" y="62" text-anchor="middle" font-size="20" font-weight="bold">1. Proveedor activo</text><text x="160" y="92" text-anchor="middle" font-size="17">Factura nueva</text><rect x="370" y="30" width="260" height="100" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="500" y="62" text-anchor="middle" font-size="20" font-weight="bold">2. Detalle</text><text x="500" y="92" text-anchor="middle" font-size="17">Producto, cantidad y costo</text><rect x="710" y="30" width="260" height="100" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="840" y="62" text-anchor="middle" font-size="20" font-weight="bold">3. Recepción completa</text><text x="840" y="92" text-anchor="middle" font-size="17">Confirmación del usuario</text><path d="M290,80 L370,80" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><path d="M630,80 L710,80" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><path d="M840,130 L840,225" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><rect x="650" y="225" width="320" height="110" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="810" y="257" text-anchor="middle" font-size="20" font-weight="bold">4. Validar y bloquear</text><text x="810" y="287" text-anchor="middle" font-size="17">Permisos y restricciones</text><text x="810" y="313" text-anchor="middle" font-size="17">Productos ordenados por ID</text><path d="M650,280 L570,280" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><rect x="140" y="225" width="430" height="110" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="355" y="257" text-anchor="middle" font-size="20" font-weight="bold">5. Una transacción</text><text x="355" y="287" text-anchor="middle" font-size="17">Compra + detalle + recepción</text><text x="355" y="313" text-anchor="middle" font-size="17">Stock + movimientos</text><path d="M355,335 L355,435" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><rect x="140" y="435" width="430" height="100" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="355" y="467" text-anchor="middle" font-size="20" font-weight="bold">6. Confirmar (COMMIT)</text><text x="355" y="497" text-anchor="middle" font-size="17">Todo se guarda en conjunto</text><path d="M570,280 L800,435" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><text x="693" y="347.5" font-size="16" fill="#354f40">Si falla</text><rect x="650" y="435" width="320" height="100" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="810" y="467" text-anchor="middle" font-size="20" font-weight="bold">Revertir (ROLLBACK)</text><text x="810" y="497" text-anchor="middle" font-size="17">Ningún cambio parcial</text><path d="M355,535 L355,625" fill="none" stroke="#486452" stroke-width="2.5" marker-end="url(#a)"/><rect x="140" y="625" width="430" height="90" rx="12" fill="#f4f7f2" stroke="#294b3e" stroke-width="2"/><text x="355" y="657" text-anchor="middle" font-size="20" font-weight="bold">7. Consultar resultado</text><text x="355" y="687" text-anchor="middle" font-size="17">Inventario, historial y alertas</text></g></svg>